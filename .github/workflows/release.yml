name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            builder: cross
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            extension: tar.gz
            builder: cross
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            extension: tar.gz
            builder: cross
          - os: macos-latest
            target: x86_64-apple-darwin
            extension: tar.gz
            builder: cargo
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: tar.gz
            builder: cargo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: zip
            builder: cargo
    env:
      ARCHIVE_NAME: how-${{ matrix.target }}.${{ matrix.extension }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.builder == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        if: matrix.builder == 'cargo'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Cross-build release binary
        if: matrix.builder == 'cross'
        run: cross build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/how" dist/stage/how
          tar -C dist/stage -czf "dist/$ARCHIVE_NAME" how

      - name: Package binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/stage -Force
          Copy-Item "target/${{ matrix.target }}/release/how.exe" dist/stage/how.exe
          Compress-Archive -Path dist/stage/how.exe -DestinationPath "dist/$env:ARCHIVE_NAME"

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.ARCHIVE_NAME }}
          archive: false

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum how-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
