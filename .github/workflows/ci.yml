name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none

      - name: Test
        run: cargo +stable nextest run --locked --all-targets

      - name: Check
        run: cargo +stable check --locked --all-targets

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  msrv:
    name: Rust 1.95 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Check
        run: cargo +1.95.0 check --locked --all-targets

  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Rustfmt
        run: cargo +nightly fmt --all -- --check

  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
